<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>大叔面包</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#111;max-width:600px;margin:0 auto;padding-bottom:70px}
    .topbar{background:#111;color:white;padding:14px 16px;font-size:17px;font-weight:500;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
    .toggle-wrap{display:flex;align-items:center;gap:6px;font-size:12px}
    .toggle{position:relative;width:36px;height:20px}
    .toggle input{opacity:0;width:0;height:0}
    .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#555;border-radius:20px;transition:.3s}
    .slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s}
    input:checked+.slider{background:#4caf50}
    input:checked+.slider:before{transform:translateX(16px)}
    .tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:white;border-top:0.5px solid #e0e0e0;display:grid;grid-template-columns:1fr 1fr 1fr;z-index:50}
    .tab{padding:12px 8px;text-align:center;font-size:12px;color:#888;cursor:pointer;border:none;background:none}
    .tab.active{color:#111;font-weight:500;border-top:2px solid #111}
    .tab-icon{font-size:20px;display:block;margin-bottom:2px}
    .page{display:none;padding:1rem}
    .page.active{display:block}
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem}
    .stat{background:white;border-radius:10px;padding:12px;border:0.5px solid #e0e0e0}
    .stat-label{font-size:11px;color:#888;margin-bottom:4px}
    .stat-val{font-size:22px;font-weight:500}
    .toolbar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
    .toolbar input,.toolbar select{flex:1;min-width:120px;padding:8px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:14px;background:white}
    .btn{padding:8px 14px;border:0.5px solid #ddd;border-radius:8px;background:white;font-size:13px;cursor:pointer}
    .btn:active{transform:scale(0.98)}
    .btn-primary{background:#111;color:white;border-color:#111}
    .btn-danger{color:#c0392b}
    .btn-success{color:#27ae60}
    .btn-warn{color:#e67e22}
    .card{background:white;border:0.5px solid #e0e0e0;border-radius:12px;margin-bottom:10px;overflow:hidden}
    .card-header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:0.5px solid #f0f0f0}
    .avatar{width:38px;height:38px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#1a73e8;flex-shrink:0}
    .card-name{font-weight:500;font-size:15px}
    .card-sub{font-size:12px;color:#888}
    .badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500;margin-left:auto}
    .paid{background:#e8f5e9;color:#2e7d32}
    .unpaid{background:#fdecea;color:#c62828}
    .pending{background:#fff8e1;color:#f57f17}
    .done-badge{background:#e8f5e9;color:#2e7d32}
    .todo-badge{background:#e8f0fe;color:#1a73e8}
    .card-body{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
    .card-body.single{grid-template-columns:1fr}
    .field-label{color:#888;font-size:11px;margin-bottom:2px}
    .field-val{font-size:13px;font-weight:500}
    .card-footer{padding:8px 14px;border-top:0.5px solid #f0f0f0;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
    .overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:100}
    .modal{background:white;border-radius:14px 14px 0 0;padding:1.2rem;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
    .modal h3{font-size:16px;font-weight:500;margin-bottom:1rem}
    .form-row{margin-bottom:10px}
    .form-row label{display:block;font-size:12px;color:#888;margin-bottom:4px}
    .form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:14px}
    .form-row textarea{height:60px;resize:none}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
    .empty{text-align:center;padding:2rem;color:#888;font-size:14px}
    .ing-item{background:white;border:0.5px solid #e0e0e0;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
    .ing-item.checked{opacity:0.5}
    .ing-item.checked .ing-name{text-decoration:line-through}
    .ing-name{flex:1;font-size:14px;font-weight:500}
    .ing-qty{font-size:13px;color:#888}
    .checkbox{width:22px;height:22px;border-radius:6px;border:0.5px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:white;font-size:14px}
    .checkbox.checked{background:#111;border-color:#111;color:white}
    .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .section-title{font-size:13px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:0.05em}
    .recipe-card{background:white;border:0.5px solid #e0e0e0;border-radius:10px;padding:12px 14px;margin-bottom:8px}
    .recipe-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .recipe-code{font-size:13px;font-weight:500;background:#e8f0fe;color:#1a73e8;padding:3px 8px;border-radius:6px}
    .recipe-name{font-size:14px;font-weight:500;flex:1;margin:0 8px}
    .recipe-ing{font-size:13px;color:#555;margin-top:4px}
    .calc-box{background:white;border:0.5px solid #e0e0e0;border-radius:12px;padding:14px;margin-bottom:1rem}
    .calc-box h4{font-size:14px;font-weight:500;margin-bottom:10px}
    .calc-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .calc-row select{flex:1;padding:7px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:13px}
    .calc-row input{width:60px;padding:7px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:13px;text-align:center}
    .calc-result{background:#f5f5f5;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px;line-height:1.8}
    .price-tag{font-size:11px;color:#888;padding:2px 6px;background:#f5f5f5;border-radius:4px;margin-left:4px}
  </style>
</head>
<body>

<div class="topbar">
  <span id="topbar-title">大叔面包</span>
  <div class="toggle-wrap">
    <span style="font-size:11px;color:#aaa">Code</span>
    <label class="toggle"><input type="checkbox" id="name-toggle" onchange="toggleNameMode()"><span class="slider"></span></label>
    <span style="font-size:11px;color:#aaa">Name</span>
  </div>
</div>

<div id="page-orders" class="page active">
  <div class="stats">
    <div class="stat"><div class="stat-label">Total orders</div><div class="stat-val" id="s-total">0</div></div>
    <div class="stat"><div class="stat-label">Unpaid</div><div class="stat-val" id="s-unpaid" style="color:#c62828">0</div></div>
    <div class="stat"><div class="stat-label">Today's orders</div><div class="stat-val" id="s-today">0</div></div>
    <div class="stat"><div class="stat-label">Revenue (RM)</div><div class="stat-val" id="s-rev">0</div></div>
  </div>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search..." oninput="renderOrders()">
    <select id="filter" onchange="renderOrders()">
      <option value="all">All</option>
      <option value="unpaid">Unpaid</option>
      <option value="paid">Paid</option>
      <option value="pending">Pending</option>
    </select>
    <button class="btn btn-primary" onclick="showOrderModal()">+ New order</button>
  </div>
  <div id="orders-list"></div>
</div>

<div id="page-schedule" class="page">
  <div class="section-header">
    <span class="section-title">Schedule</span>
    <button class="btn btn-primary" onclick="showTaskModal()">+ Add task</button>
  </div>
  <div id="schedule-list"></div>
</div>

<div id="page-ingredients" class="page">
  <div class="calc-box">
    <h4>Ingredient calculator</h4>
    <div id="calc-rows">
      <div class="calc-row">
        <select class="calc-bread-select"><option value="">Select bread...</option></select>
        <input type="number" class="calc-qty-input" placeholder="qty" min="1" value="1">
        <button class="btn btn-danger" style="padding:6px 10px" onclick="removeCalcRow(this)">✕</button>
      </div>
    </div>
    <button class="btn" style="font-size:12px;margin-top:6px" onclick="addCalcRow()">+ Add another bread</button>
    <button class="btn btn-primary" style="font-size:12px;margin-top:6px;margin-left:6px" onclick="calculate()">Calculate</button>
    <div class="calc-result" id="calc-result" style="display:none"></div>
  </div>

  <div class="section-header">
    <span class="section-title">Shopping list</span>
    <button class="btn btn-primary" onclick="showIngModal()">+ Add item</button>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:1rem">
    <button class="btn" style="font-size:12px" onclick="clearChecked()">Clear checked</button>
    <button class="btn btn-danger" style="font-size:12px" onclick="clearAll()">Clear all</button>
  </div>
  <div id="ingredients-list"></div>

  <div class="section-header" style="margin-top:1.2rem">
    <span class="section-title">Recipes</span>
    <button class="btn btn-primary" onclick="showRecipeModal()">+ Add recipe</button>
  </div>
  <div id="recipes-list"></div>
</div>

<div id="modal-area"></div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('orders')" id="tab-orders">
    <span class="tab-icon">🧾</span>Orders
  </button>
  <button class="tab" onclick="switchTab('schedule')" id="tab-schedule">
    <span class="tab-icon">🕐</span>Schedule
  </button>
  <button class="tab" onclick="switchTab('ingredients')" id="tab-ingredients">
    <span class="tab-icon">🧂</span>Ingredients
  </button>
</div>

<script>
const MENU = [
  {code:'A1',name:'Artisan White Sourdough',price:18},
  {code:'A2',name:'Rye Sourdough',price:20},
  {code:'A3',name:'Rolled Oat Sourdough',price:20},
  {code:'B1',name:'Walnut Cranberry',price:25},
  {code:'B2',name:'Pandan Chocolate',price:25},
  {code:'B3',name:'Multiseeds',price:25},
  {code:'B4',name:'Cheddar and Herbs',price:25},
  {code:'B5',name:'Raisins and Chiaseeds',price:25},
  {code:'B6',name:'Walnut Black Sesame',price:25},
  {code:'C1',name:'Red Velvet',price:30},
  {code:'C4',name:'Tomato and Cheese',price:30},
  {code:'C5',name:'Jalapeno and Cheese',price:30},
  {code:'D1',name:'Wu Ren',price:32},
  {code:'D2',name:'Double Chocolate',price:32},
];

let orders = JSON.parse(localStorage.getItem('bread-orders')||'[]');
let tasks = JSON.parse(localStorage.getItem('bread-tasks')||'[]');
let ingredients = JSON.parse(localStorage.getItem('bread-ingredients')||'[]');
let recipes = JSON.parse(localStorage.getItem('bread-recipes')||'[]');
let nextOrderId = parseInt(localStorage.getItem('bread-oid')||'1');
let nextTaskId = parseInt(localStorage.getItem('bread-tid')||'1');
let nextIngId = parseInt(localStorage.getItem('bread-iid')||'1');
let nextRecipeId = parseInt(localStorage.getItem('bread-rid')||'1');
let editingOrder=null,editingTask=null,editingIng=null,editingRecipe=null;
let showName = localStorage.getItem('bread-showname')==='true';

const titles={orders:'大叔面包',schedule:'Schedule',ingredients:'Ingredients'};

function save(){
  localStorage.setItem('bread-orders',JSON.stringify(orders));
  localStorage.setItem('bread-tasks',JSON.stringify(tasks));
  localStorage.setItem('bread-ingredients',JSON.stringify(ingredients));
  localStorage.setItem('bread-recipes',JSON.stringify(recipes));
  localStorage.setItem('bread-oid',nextOrderId);
  localStorage.setItem('bread-tid',nextTaskId);
  localStorage.setItem('bread-iid',nextIngId);
  localStorage.setItem('bread-rid',nextRecipeId);
  localStorage.setItem('bread-showname',showName);
}

function breadLabel(code){
  const item = MENU.find(m=>m.code===code);
  if(!item) return code;
  return showName ? item.name : item.code;
}

function toggleNameMode(){
  showName = document.getElementById('name-toggle').checked;
  save();
  renderOrders();
  renderRecipes();
  populateCalcSelects();
}

function switchTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('topbar-title').textContent=titles[tab];
}

function today(){return new Date().toISOString().split('T')[0]}
function initials(name){return name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()}

function updateStats(){
  document.getElementById('s-total').textContent=orders.length;
  document.getElementById('s-unpaid').textContent=orders.filter(o=>o.status==='unpaid').length;
  document.getElementById('s-today').textContent=orders.filter(o=>o.date===today()).length;
  const rev=orders.filter(o=>o.status==='paid').reduce((a,o)=>a+o.price,0);
  document.getElementById('s-rev').textContent='RM '+rev.toFixed(2);
}

function renderOrders(){
  const q=document.getElementById('search').value.toLowerCase();
  const f=document.getElementById('filter').value;
  let filtered=orders.filter(o=>{
    const match=o.name.toLowerCase().includes(q)||o.bread.toLowerCase().includes(q);
    return match&&(f==='all'||o.status===f);
  });
  const list=document.getElementById('orders-list');
  if(!filtered.length){list.innerHTML='<div class="empty">No orders found</div>';updateStats();return;}
  list.innerHTML=filtered.map(o=>`
    <div class="card">
      <div class="card-header">
        <div class="avatar">${initials(o.name)}</div>
        <div><div class="card-name">${o.name}</div><div class="card-sub">${o.phone}</div></div>
        <span class="badge ${o.status}">${o.status}</span>
      </div>
      <div class="card-body">
        <div><div class="field-label">Bread order</div><div class="field-val">${breadLabel(o.bread)} x${o.qty||1}</div></div>
        <div><div class="field-label">Price</div><div class="field-val">RM ${o.price.toFixed(2)}</div></div>
        <div><div class="field-label">Date</div><div class="field-val">${o.date}</div></div>
        <div><div class="field-label">Time</div><div class="field-val">${o.time}</div></div>
        <div style="grid-column:1/-1"><div class="field-label">Address</div><div class="field-val">${o.address}</div></div>
        ${o.notes?`<div style="grid-column:1/-1"><div class="field-label">Notes</div><div class="field-val" style="color:#888">${o.notes}</div></div>`:''}
      </div>
      <div class="card-footer">
        ${o.status==='unpaid'?`<button class="btn btn-success" onclick="markPaid(${o.id})">Mark paid</button>`:''}
        <button class="btn" onclick="editOrder(${o.id})">Edit</button>
        <button class="btn btn-danger" onclick="deleteOrder(${o.id})">Delete</button>
      </div>
    </div>`).join('');
  updateStats();
}

function renderSchedule(){
  const list=document.getElementById('schedule-list');
  if(!tasks.length){list.innerHTML='<div class="empty">No tasks yet.</div>';return;}
  const sorted=[...tasks].sort((a,b)=>a.date+a.time>b.date+b.time?1:-1);
  list.innerHTML=sorted.map(t=>`
    <div class="card">
      <div class="card-header">
        <div class="avatar" style="background:${t.done?'#e8f5e9':'#e8f0fe'};color:${t.done?'#2e7d32':'#1a73e8'}">${t.done?'✓':'⏰'}</div>
        <div><div class="card-name">${t.title}</div><div class="card-sub">${t.date} at ${t.time}</div></div>
        <span class="badge ${t.done?'done-badge':'todo-badge'}">${t.done?'done':'to do'}</span>
      </div>
      ${t.notes?`<div class="card-body single"><div class="field-label">Notes</div><div class="field-val">${t.notes}</div></div>`:''}
      <div class="card-footer">
        <button class="btn ${t.done?'btn-warn':'btn-success'}" onclick="toggleTask(${t.id})">${t.done?'Undo':'Mark done'}</button>
        <button class="btn" onclick="editTask(${t.id})">Edit</button>
        <button class="btn btn-danger" onclick="deleteTask(${t.id})">Delete</button>
      </div>
    </div>`).join('');
}

function renderIngredients(){
  const list=document.getElementById('ingredients-list');
  if(!ingredients.length){list.innerHTML='<div class="empty">No items yet.</div>';return;}
  const all=[...ingredients.filter(i=>!i.checked),...ingredients.filter(i=>i.checked)];
  list.innerHTML=all.map(i=>`
    <div class="ing-item ${i.checked?'checked':''}">
      <div class="checkbox ${i.checked?'checked':''}" onclick="toggleIng(${i.id})">${i.checked?'✓':''}</div>
      <span class="ing-name">${i.name}</span>
      <span class="ing-qty">${i.qty}</span>
      <button class="btn" style="padding:4px 10px;font-size:12px" onclick="editIng(${i.id})">Edit</button>
      <button class="btn btn-danger" style="padding:4px 10px;font-size:12px" onclick="deleteIng(${i.id})">✕</button>
    </div>`).join('');
}

function renderRecipes(){
  const list=document.getElementById('recipes-list');
  if(!recipes.length){list.innerHTML='<div class="empty">No recipes yet. Add ingredients for each bread.</div>';return;}
  list.innerHTML=recipes.map(r=>`
    <div class="recipe-card">
      <div class="recipe-header">
        <span class="recipe-code">${r.code}</span>
        <span class="recipe-name">${r.breadName}</span>
        <button class="btn" style="padding:4px 10px;font-size:12px" onclick="editRecipe(${r.id})">Edit</button>
        <button class="btn btn-danger" style="padding:4px 10px;font-size:12px" onclick="deleteRecipe(${r.id})">✕</button>
      </div>
      <div class="recipe-ing">${r.ingredients||'No ingredients added'}</div>
    </div>`).join('');
}

function populateCalcSelects(){
  document.querySelectorAll('.calc-bread-select').forEach(sel=>{
    const val=sel.value;
    sel.innerHTML='<option value="">Select bread...</option>'+
      MENU.map(m=>`<option value="${m.code}" ${val===m.code?'selected':''}>${m.code} - ${showName?m.name:m.code}</option>`).join('');
  });
}

function addCalcRow(){
  const row=document.createElement('div');
  row.className='calc-row';
  row.innerHTML=`<select class="calc-bread-select"><option value="">Select bread...</option>${MENU.map(m=>`<option value="${m.code}">${m.code} - ${showName?m.name:m.code}</option>`).join('')}</select><input type="number" class="calc-qty-input" placeholder="qty" min="1" value="1"><button class="btn btn-danger" style="padding:6px 10px" onclick="removeCalcRow(this)">✕</button>`;
  document.getElementById('calc-rows').appendChild(row);
}

function removeCalcRow(btn){
  const rows=document.querySelectorAll('#calc-rows .calc-row');
  if(rows.length>1) btn.parentElement.remove();
}

function calculate(){
  const rows=document.querySelectorAll('#calc-rows .calc-row');
  const totals={};
  let hasSelection=false;
  rows.forEach(row=>{
    const code=row.querySelector('.calc-bread-select').value;
    const qty=parseInt(row.querySelector('.calc-qty-input').value)||1;
    if(!code) return;
    hasSelection=true;
    const recipe=recipes.find(r=>r.code===code);
    if(!recipe||!recipe.ingredients){
      totals[`${code} (no recipe)`]=(totals[`${code} (no recipe)`]||0)+qty;
      return;
    }
    const lines=recipe.ingredients.split('\n').filter(l=>l.trim());
    lines.forEach(line=>{
      const parts=line.split(':');
      if(parts.length<2) return;
      const ingName=parts[0].trim();
      const rest=parts[1].trim();
      const match=rest.match(/^([\d.]+)\s*(.*)$/);
      if(match){
        const amount=parseFloat(match[1])*qty;
        const unit=match[2].trim();
        const key=`${ingName}|${unit}`;
        totals[key]=(totals[key]||0)+amount;
      } else {
        totals[ingName]=(totals[ingName]||0)+qty;
      }
    });
  });
  const result=document.getElementById('calc-result');
  if(!hasSelection){result.style.display='none';return;}
  if(!Object.keys(totals).length){result.style.display='block';result.innerHTML='No recipes found. Add recipes first.';return;}
  result.style.display='block';
  result.innerHTML='<strong>Total ingredients needed:</strong><br>'+
    Object.entries(totals).map(([k,v])=>{
      const parts=k.split('|');
      return `• ${parts[0]}: <strong>${Number.isInteger(v)?v:v.toFixed(1)} ${parts[1]||''}</strong>`;
    }).join('<br>');
}

function showOrderModal(data){
  const d=data||{name:'',phone:'',bread:'A1',qty:1,address:'',date:today(),time:'08:00',price:18,status:'unpaid',notes:''};
  document.getElementById('modal-area').innerHTML=`
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${editingOrder?'Edit order':'New order'}</h3>
        <div class="form-row"><label>Customer name</label><input id="f-name" value="${d.name}" placeholder="Full name"></div>
        <div class="form-row"><label>Phone number</label><input id="f-phone" value="${d.phone}" placeholder="012-3456789"></div>
        <div class="form-grid">
          <div class="form-row"><label>Bread</label>
            <select id="f-bread" onchange="autoPrice()">
              ${MENU.map(m=>`<option value="${m.code}" ${d.bread===m.code?'selected':''}>${m.code} - ${m.name}</option>`).join('')}
            </select>
          </div>
          <div class="form-row"><label>Quantity</label><input type="number" id="f-qty" value="${d.qty||1}" min="1" onchange="autoPrice()"></div>
        </div>
        <div class="form-row"><label>Delivery address</label><textarea id="f-addr">${d.address}</textarea></div>
        <div class="form-grid">
          <div class="form-row"><label>Date</label><input type="date" id="f-date" value="${d.date}"></div>
          <div class="form-row"><label>Time</label><input type="time" id="f-time" value="${d.time}"></div>
        </div>
        <div class="form-grid">
          <div class="form-row"><label>Price (RM)</label><input type="number" id="f-price" value="${d.price}" placeholder="0.00"></div>
          <div class="form-row"><label>Payment</label>
            <select id="f-status">
              <option value="unpaid" ${d.status==='unpaid'?'selected':''}>Unpaid</option>
              <option value="paid" ${d.status==='paid'?'selected':''}>Paid</option>
              <option value="pending" ${d.status==='pending'?'selected':''}>Pending</option>
            </select>
          </div>
        </div>
        <div class="form-row"><label>Notes (optional)</label><textarea id="f-notes">${d.notes}</textarea></div>
        <div class="form-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveOrder()">${editingOrder?'Save':'Add order'}</button>
        </div>
      </div>
    </div>`;
}

function autoPrice(){
  const code=document.getElementById('f-bread').value;
  const qty=parseInt(document.getElementById('f-qty').value)||1;
  const item=MENU.find(m=>m.code===code);
  if(item) document.getElementById('f-price').value=(item.price*qty).toFixed(2);
}

function showTaskModal(data){
  const d=data||{title:'',date:today(),time:'06:00',notes:''};
  document.getElementById('modal-area').innerHTML=`
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${editingTask?'Edit task':'New task'}</h3>
        <div class="form-row"><label>Task name</label><input id="t-title" value="${d.title}" placeholder="e.g. Preheat oven"></div>
        <div class="form-grid">
          <div class="form-row"><label>Date</label><input type="date" id="t-date" value="${d.date}"></div>
          <div class="form-row"><label>Time</label><input type="time" id="t-time" value="${d.time}"></div>
        </div>
        <div class="form-row"><label>Notes (optional)</label><textarea id="t-notes">${d.notes}</textarea></div>
        <div class="form-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveTask()">${editingTask?'Save':'Add task'}</button>
        </div>
      </div>
    </div>`;
}

function showIngModal(data){
  const d=data||{name:'',qty:''};
  document.getElementById('modal-area').innerHTML=`
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${editingIng?'Edit item':'New item'}</h3>
        <div class="form-row"><label>Ingredient name</label><input id="i-name" value="${d.name}" placeholder="e.g. Bread flour"></div>
        <div class="form-row"><label>Quantity</label><input id="i-qty" value="${d.qty}" placeholder="e.g. 2kg, 500g, 3 eggs"></div>
        <div class="form-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveIng()">${editingIng?'Save':'Add item'}</button>
        </div>
      </div>
    </div>`;
}

function showRecipeModal(data){
  const d=data||{code:'A1',ingredients:''};
  document.getElementById('modal-area').innerHTML=`
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${editingRecipe?'Edit recipe':'New recipe'}</h3>
        <div class="form-row"><label>Bread</label>
          <select id="r-code">
            ${MENU.map(m=>`<option value="${m.code}" ${d.code===m.code?'selected':''}>${m.code} - ${m.name}</option>`).join('')}
          </select>
        </div>
        <div class="form-row">
          <label>Ingredients (one per line, format: name: amount unit)</label>
          <textarea id="r-ing" style="height:140px" placeholder="flour: 500 gram&#10;water: 350 gram&#10;salt: 10 gram&#10;yeast: 5 gram">${d.ingredients}</textarea>
        </div>
        <div class="form-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveRecipe()">${editingRecipe?'Save':'Add recipe'}</button>
        </div>
      </div>
    </div>`;
}

function closeModal(){document.getElementById('modal-area').innerHTML='';editingOrder=null;editingTask=null;editingIng=null;editingRecipe=null;}

function saveOrder(){
  const code=document.getElementById('f-bread').value;
  const menuItem=MENU.find(m=>m.code===code);
  const o={
    id:editingOrder||nextOrderId++,
    name:document.getElementById('f-name').value.trim(),
    phone:document.getElementById('f-phone').value.trim(),
    bread:code,
    qty:parseInt(document.getElementById('f-qty').value)||1,
    address:document.getElementById('f-addr').value.trim(),
    date:document.getElementById('f-date').value,
    time:document.getElementById('f-time').value,
    price:parseFloat(document.getElementById('f-price').value)||0,
    status:document.getElementById('f-status').value,
    notes:document.getElementById('f-notes').value.trim(),
  };
  if(!o.name){alert('Please fill in customer name.');return;}
  if(editingOrder){orders=orders.map(x=>x.id===editingOrder?o:x);}
  else{orders.push(o);}
  save();closeModal();renderOrders();
}

function saveTask(){
  const t={
    id:editingTask||nextTaskId++,
    title:document.getElementById('t-title').value.trim(),
    date:document.getElementById('t-date').value,
    time:document.getElementById('t-time').value,
    notes:document.getElementById('t-notes').value.trim(),
    done:false,
  };
  if(!t.title){alert('Please enter a task name.');return;}
  if(editingTask){const old=tasks.find(x=>x.id===editingTask);t.done=old?old.done:false;tasks=tasks.map(x=>x.id===editingTask?t:x);}
  else{tasks.push(t);}
  save();closeModal();renderSchedule();
}

function saveIng(){
  const i={id:editingIng||nextIngId++,name:document.getElementById('i-name').value.trim(),qty:document.getElementById('i-qty').value.trim(),checked:false};
  if(!i.name){alert('Please enter ingredient name.');return;}
  if(editingIng){const old=ingredients.find(x=>x.id===editingIng);i.checked=old?old.checked:false;ingredients=ingredients.map(x=>x.id===editingIng?i:x);}
  else{ingredients.push(i);}
  save();closeModal();renderIngredients();
}

function saveRecipe(){
  const code=document.getElementById('r-code').value;
  const menuItem=MENU.find(m=>m.code===code);
  const r={
    id:editingRecipe||nextRecipeId++,
    code:code,
    breadName:menuItem?menuItem.name:code,
    ingredients:document.getElementById('r-ing').value.trim(),
  };
  if(editingRecipe){recipes=recipes.map(x=>x.id===editingRecipe?r:x);}
  else{
    const existing=recipes.find(x=>x.code===code);
    if(existing){recipes=recipes.map(x=>x.code===code?r:x);}
    else{recipes.push(r);}
  }
  save();closeModal();renderRecipes();
}

function editOrder(id){editingOrder=id;showOrderModal(orders.find(x=>x.id===id));}
function editTask(id){editingTask=id;showTaskModal(tasks.find(x=>x.id===id));}
function editIng(id){editingIng=id;showIngModal(ingredients.find(x=>x.id===id));}
function editRecipe(id){editingRecipe=id;showRecipeModal(recipes.find(x=>x.id===id));}

function deleteOrder(id){if(confirm('Delete this order?')){orders=orders.filter(x=>x.id!==id);save();renderOrders();}}
function deleteTask(id){if(confirm('Delete this task?')){tasks=tasks.filter(x=>x.id!==id);save();renderSchedule();}}
function deleteIng(id){ingredients=ingredients.filter(x=>x.id!==id);save();renderIngredients();}
function deleteRecipe(id){if(confirm('Delete this recipe?')){recipes=recipes.filter(x=>x.id!==id);save();renderRecipes();}}

function markPaid(id){orders=orders.map(o=>o.id===id?{...o,status:'paid'}:o);save();renderOrders();}
function toggleTask(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save();renderSchedule();}
function toggleIng(id){ingredients=ingredients.map(i=>i.id===id?{...i,checked:!i.checked}:i);save();renderIngredients();}
function clearChecked(){ingredients=ingredients.filter(i=>!i.checked);save();renderIngredients();}
function clearAll(){if(confirm('Clear all items?')){ingredients=[];save();renderIngredients();}}

document.getElementById('name-toggle').checked=showName;
populateCalcSelects();
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}
renderOrders();renderSchedule();renderIngredients();renderRecipes();
</script>
</body>
</html>
