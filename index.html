<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>大叔面包</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#111;max-width:600px;margin:0 auto;padding-bottom:70px}
    .topbar{background:#111;color:white;padding:14px 16px;font-size:17px;font-weight:500;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
    .toggle-wrap{display:flex;align-items:center;gap:6px;font-size:12px}
    .toggle{position:relative;width:36px;height:20px}
    .toggle input{opacity:0;width:0;height:0}
    .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#555;border-radius:20px;transition:.3s}
    .slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s}
    input:checked+.slider{background:#4caf50}
    input:checked+.slider:before{transform:translateX(16px)}
    .tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:white;border-top:0.5px solid #e0e0e0;display:grid;grid-template-columns:repeat(6,1fr);z-index:50}
    .tab{padding:10px 4px;text-align:center;font-size:10px;color:#888;cursor:pointer;border:none;background:none;line-height:1.3}
    .tab.active{color:#111;font-weight:500;border-top:2px solid #111}
    .tab-icon{font-size:16px;display:block;margin-bottom:2px}
    .page{display:none;padding:1rem}
    .page.active{display:block}
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem}
    .stat{background:white;border-radius:10px;padding:12px;border:0.5px solid #e0e0e0}
    .stat-label{font-size:11px;color:#888;margin-bottom:4px}
    .stat-val{font-size:22px;font-weight:500}
    .toolbar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
    .toolbar input,.toolbar select{flex:1;min-width:120px;padding:8px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:14px;background:white}
    .btn{padding:8px 14px;border:0.5px solid #ddd;border-radius:8px;background:white;font-size:13px;cursor:pointer}
    .btn:active{transform:scale(0.98)}
    .btn-primary{background:#111;color:white;border-color:#111}
    .btn-danger{color:#c0392b}
    .btn-success{color:#27ae60}
    .btn-warn{color:#e67e22}
    .card{background:white;border:0.5px solid #e0e0e0;border-radius:12px;margin-bottom:10px;overflow:hidden}
    .card-header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:0.5px solid #f0f0f0}
    .avatar{width:38px;height:38px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#1a73e8;flex-shrink:0}
    .card-name{font-weight:500;font-size:15px}
    .card-sub{font-size:12px;color:#888}
    .badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500;margin-left:auto}
    .paid{background:#e8f5e9;color:#2e7d32}
    .unpaid{background:#fdecea;color:#c62828}
    .pending{background:#fff8e1;color:#f57f17}
    .done-badge{background:#e8f5e9;color:#2e7d32}
    .todo-badge{background:#e8f0fe;color:#1a73e8}
    .history-badge{background:#f3e5f5;color:#6a1b9a}
    .card-body{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
    .card-body.single{grid-template-columns:1fr}
    .field-label{color:#888;font-size:11px;margin-bottom:2px}
    .field-val{font-size:13px;font-weight:500}
    .card-footer{padding:8px 14px;border-top:0.5px solid #f0f0f0;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
    .overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:100}
    .modal{background:white;border-radius:14px 14px 0 0;padding:1.2rem;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
    .modal h3{font-size:16px;font-weight:500;margin-bottom:1rem}
    .form-row{margin-bottom:10px}
    .form-row label{display:block;font-size:12px;color:#888;margin-bottom:4px}
    .form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:14px}
    .form-row textarea{height:60px;resize:none}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
    .empty{text-align:center;padding:2rem;color:#888;font-size:14px}
    .ing-item{background:white;border:0.5px solid #e0e0e0;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
    .ing-item.checked{opacity:0.5}
    .ing-item.checked .ing-name{text-decoration:line-through}
    .ing-name{flex:1;font-size:14px;font-weight:500}
    .ing-qty{font-size:13px;color:#888}
    .checkbox{width:22px;height:22px;border-radius:6px;border:0.5px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:white;font-size:14px}
    .checkbox.checked{background:#111;border-color:#111;color:white}
    .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .section-title{font-size:13px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:0.05em}
    .recipe-card{background:white;border:0.5px solid #e0e0e0;border-radius:10px;padding:12px 14px;margin-bottom:8px}
    .recipe-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px}
    .recipe-code{font-size:13px;font-weight:500;background:#e8f0fe;color:#1a73e8;padding:3px 8px;border-radius:6px}
    .recipe-name{font-size:14px;font-weight:500;flex:1;margin:0 8px}
    .recipe-ing{font-size:13px;color:#555;margin-top:4px}
    .calc-box{background:white;border:0.5px solid #e0e0e0;border-radius:12px;padding:14px;margin-bottom:1rem}
    .calc-box h4{font-size:14px;font-weight:500;margin-bottom:10px}
    .calc-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .calc-row select{flex:1;padding:7px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:13px}
    .calc-row input{width:60px;padding:7px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:13px;text-align:center}
    .calc-result{background:#f5f5f5;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px;line-height:1.8}
    .bread-line{display:flex;gap:8px;margin-bottom:8px;align-items:center}
    .bread-line select{flex:2;padding:7px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:13px}
    .bread-line input{width:55px;padding:7px 8px;border:0.5px solid #ddd;border-radius:8px;font-size:13px;text-align:center}
    .contact-card{background:white;border:0.5px solid #e0e0e0;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
    .contact-info{flex:1}
    .contact-name{font-size:14px;font-weight:500}
    .contact-sub{font-size:12px;color:#888;margin-top:2px}
    .daily-item{background:white;border:0.5px solid #e0e0e0;border-radius:10px;padding:12px 14px;margin-bottom:8px}
    .daily-bread{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:0.5px solid #f0f0f0;font-size:14px}
    .daily-bread:last-child{border-bottom:none}
    .daily-qty{font-weight:500;font-size:16px;color:#1a73e8}
    .export-box{background:white;border:0.5px solid #e0e0e0;border-radius:12px;padding:14px;margin-bottom:1rem}
    .export-box h4{font-size:14px;font-weight:500;margin-bottom:10px}
  </style>
</head>
<body>

<div class="topbar">
  <span id="topbar-title">大叔面包</span>
  <div class="toggle-wrap">
    <span style="font-size:11px;color:#aaa">Code</span>
    <label class="toggle"><input type="checkbox" id="name-toggle" onchange="toggleNameMode()"><span class="slider"></span></label>
    <span style="font-size:11px;color:#aaa">Name</span>
  </div>
</div>

<div id="page-orders" class="page active">
  <div class="stats">
    <div class="stat"><div class="stat-label">Active orders</div><div class="stat-val" id="s-total">0</div></div>
    <div class="stat"><div class="stat-label">Unpaid</div><div class="stat-val" id="s-unpaid" style="color:#c62828">0</div></div>
    <div class="stat"><div class="stat-label">Today</div><div class="stat-val" id="s-today">0</div></div>
    <div class="stat"><div class="stat-label">Revenue (RM)</div><div class="stat-val" id="s-rev">0</div></div>
  </div>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search..." oninput="renderOrders()">
    <select id="filter" onchange="renderOrders()">
      <option value="all">All</option>
      <option value="unpaid">Unpaid</option>
      <option value="paid">Paid</option>
      <option value="pending">Pending</option>
    </select>
    <button class="btn btn-primary" onclick="showOrderModal()">+ New order</button>
  </div>
  <div id="orders-list"></div>
</div>

<div id="page-daily" class="page">
  <div class="form-row" style="margin-bottom:1rem">
    <label>Select date</label>
    <input type="date" id="daily-date" onchange="renderDaily()">
  </div>
  <div id="daily-list"></div>
</div>

<div id="page-schedule" class="page">
  <div class="section-header">
    <span class="section-title">Schedule</span>
    <button class="btn btn-primary" onclick="showTaskModal()">+ Add task</button>
  </div>
  <div id="schedule-list"></div>
</div>

<div id="page-ingredients" class="page">
  <div class="calc-box">
    <h4>Ingredient calculator</h4>
    <div id="calc-rows">
      <div class="calc-row">
        <select class="calc-bread-select"><option value="">Select bread...</option></select>
        <input type="number" class="calc-qty-input" placeholder="qty" min="1" value="1">
        <button class="btn btn-danger" style="padding:6px 10px" onclick="removeCalcRow(this)">✕</button>
      </div>
    </div>
    <button class="btn" style="font-size:12px;margin-top:6px" onclick="addCalcRow()">+ Add bread</button>
    <button class="btn btn-primary" style="font-size:12px;margin-top:6px;margin-left:6px" onclick="calculate()">Calculate</button>
    <div class="calc-result" id="calc-result" style="display:none"></div>
  </div>
  <div class="section-header">
    <span class="section-title">Shopping list</span>
    <button class="btn btn-primary" onclick="showIngModal()">+ Add item</button>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:1rem">
    <button class="btn" style="font-size:12px" onclick="clearChecked()">Clear checked</button>
    <button class="btn btn-danger" style="font-size:12px" onclick="clearAll()">Clear all</button>
  </div>
  <div id="ingredients-list"></div>
  <div class="section-header" style="margin-top:1.2rem">
    <span class="section-title">Recipes</span>
    <button class="btn btn-primary" onclick="showRecipeModal()">+ Add recipe</button>
  </div>
  <div id="recipes-list"></div>
</div>

<div id="page-history" class="page">
  <div class="export-box">
    <h4>Export to Excel</h4>
    <div class="form-grid" style="margin-bottom:10px">
      <div class="form-row"><label>From date</label><input type="date" id="export-from"></div>
      <div class="form-row"><label>To date</label><input type="date" id="export-to"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" style="font-size:12px" onclick="exportExcel(false)">Export date range</button>
      <button class="btn" style="font-size:12px" onclick="exportExcel(true)">Export all history</button>
    </div>
  </div>
  <div class="toolbar">
    <input type="text" id="history-search" placeholder="Search history..." oninput="renderHistory()">
  </div>
  <div id="history-list"></div>
</div>

<div id="page-contacts" class="page">
  <div class="section-header">
    <span class="section-title">Contacts</span>
    <button class="btn btn-primary" onclick="showContactModal()">+ Add contact</button>
  </div>
  <input type="text" id="contact-search" placeholder="Search contacts..." oninput="renderContacts()" style="width:100%;padding:8px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:1rem;background:white">
  <div id="contacts-list"></div>
</div>

<div id="modal-area"></div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('orders')" id="tab-orders"><span class="tab-icon">🧾</span>Orders</button>
  <button class="tab" onclick="switchTab('daily')" id="tab-daily"><span class="tab-icon">📅</span>Daily</button>
  <button class="tab" onclick="switchTab('schedule')" id="tab-schedule"><span class="tab-icon">🕐</span>Schedule</button>
  <button class="tab" onclick="switchTab('ingredients')" id="tab-ingredients"><span class="tab-icon">🧂</span>Ingredients</button>
  <button class="tab" onclick="switchTab('history')" id="tab-history"><span class="tab-icon">📦</span>History</button>
  <button class="tab" onclick="switchTab('contacts')" id="tab-contacts"><span class="tab-icon">👤</span>Contacts</button>
</div>

<script>
const SUPABASE_URL = 'https://oimugsikmaedswjrqcwy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WDpxlIzvMa7s1Lbfv_luOg_IP7YoHcg';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const MENU=[
  {code:'A1',name:'Artisan White Sourdough',price:18},
  {code:'A2',name:'Rye Sourdough',price:20},
  {code:'A3',name:'Rolled Oat Sourdough',price:20},
  {code:'B1',name:'Walnut Cranberry',price:25},
  {code:'B2',name:'Pandan Chocolate',price:25},
  {code:'B3',name:'Multiseeds',price:25},
  {code:'B4',name:'Cheddar and Herbs',price:25},
  {code:'B5',name:'Raisins and Chiaseeds',price:25},
  {code:'B6',name:'Walnut Black Sesame',price:25},
  {code:'C1',name:'Red Velvet',price:30},
  {code:'C4',name:'Tomato and Cheese',price:30},
  {code:'C5',name:'Jalapeno and Cheese',price:30},
  {code:'D1',name:'Wu Ren',price:32},
  {code:'D2',name:'Double Chocolate',price:32},
];

let orders=JSON.parse(localStorage.getItem('bread-orders')||'[]');
let history=JSON.parse(localStorage.getItem('bread-history')||'[]');
let tasks=JSON.parse(localStorage.getItem('bread-tasks')||'[]');
let ingredients=JSON.parse(localStorage.getItem('bread-ingredients')||'[]');
let recipes=JSON.parse(localStorage.getItem('bread-recipes')||'[]');
let contacts=JSON.parse(localStorage.getItem('bread-contacts')||'[]');
let nextOrderId=parseInt(localStorage.getItem('bread-oid')||'1');
let nextTaskId=parseInt(localStorage.getItem('bread-tid')||'1');
let nextIngId=parseInt(localStorage.getItem('bread-iid')||'1');
let nextRecipeId=parseInt(localStorage.getItem('bread-rid')||'1');
let nextContactId=parseInt(localStorage.getItem('bread-cid')||'1');
let editingOrder=null,editingTask=null,editingIng=null,editingRecipe=null,editingContact=null;
let showName=localStorage.getItem('bread-showname')==='true';

const titles={orders:'大叔面包',daily:'Daily View',schedule:'Schedule',ingredients:'Ingredients',history:'History',contacts:'Contacts'};

function save(){
  localStorage.setItem('bread-showname',showName);
}

async function syncToSupabase(table, data){
  await db.from(table).upsert(data);
}

async function loadFromSupabase(){
  const [o,h,t,i,r,c] = await Promise.all([
    db.from('orders').select('*'),
    db.from('history').select('*'),
    db.from('tasks').select('*'),
    db.from('ingredients').select('*'),
    db.from('recipes').select('*'),
    db.from('contacts').select('*'),
  ]);
  orders=o.data||[];
  history=h.data||[];
  tasks=t.data||[];
  ingredients=i.data||[];
  recipes=r.data||[];
  contacts=c.data||[];
  renderOrders();renderSchedule();renderIngredients();renderRecipes();renderHistory();renderContacts();
}

function checkAutoHistory(){
  const now=new Date();
  const changed=[];
  orders=orders.filter(o=>{
    const dt=new Date(o.date+'T'+o.time);
    if(dt<now){
      history.push({...o,completedAt:now.toISOString()});
      changed.push(o.id);
      return false;
    }
    return true;
  });
  if(changed.length){save();}
}

function breadLabel(code){
  const item=MENU.find(m=>m.code===code);
  if(!item) return code;
  return showName?item.name:item.code;
}

function breadLines(items){
  if(!items||!items.length) return '';
  return items.map(i=>`${breadLabel(i.code)} x${i.qty}`).join(', ');
}

function toggleNameMode(){
  showName=document.getElementById('name-toggle').checked;
  save();
  renderOrders();
  renderHistory();
  renderRecipes();
  renderDaily();
  populateCalcSelects();
}

function switchTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('topbar-title').textContent=titles[tab];
  if(tab==='daily'&&!document.getElementById('daily-date').value){
    document.getElementById('daily-date').value=today();
    renderDaily();
  }
}

function today(){return new Date().toISOString().split('T')[0]}
function initials(name){return name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()}

function updateStats(){
  document.getElementById('s-total').textContent=orders.length;
  document.getElementById('s-unpaid').textContent=orders.filter(o=>o.status==='unpaid').length;
  document.getElementById('s-today').textContent=orders.filter(o=>o.date===today()).length;
  const rev=orders.filter(o=>o.status==='paid').reduce((a,o)=>a+(o.totalPrice||0),0);
  document.getElementById('s-rev').textContent='RM '+rev.toFixed(2);
}

function orderCardHTML(o, isHistory){
  const items=o.items||[];
  const breadStr=items.map(i=>`${breadLabel(i.code)} x${i.qty}`).join(', ');
  const payBadge=o.payMethod==='tng'?'T&G':'Cash';
  
  const receiptHtml = o.receiptUrl 
    ? `<div class="receipt-container">
         <div class="field-label">Receipt</div>
         <img src="${o.receiptUrl}" class="receipt-preview" onclick="window.open('${o.receiptUrl}')">
       </div>` 
    : '';

  return `
    <div class="card">
      <div class="card-header">
        <div class="avatar">${initials(o.name)}</div>
        <div><div class="card-name">${o.name}</div><div class="card-sub">${o.phone}</div></div>
        <span class="badge ${o.status}">${o.status} · ${payBadge}</span>
      </div>
      <div class="card-body">
        <div style="grid-column:1/-1"><div class="field-label">Bread order</div><div class="field-val">${breadStr}</div></div>
        <div><div class="field-label">Total price</div><div class="field-val">RM ${(o.totalPrice||0).toFixed(2)}</div></div>
        <div><div class="field-label">Date & Time</div><div class="field-val">${o.date} ${o.time}</div></div>
        <div style="grid-column:1/-1"><div class="field-label">Address</div><div class="field-val">${o.address}</div></div>
        ${o.notes?`<div style="grid-column:1/-1"><div class="field-label">Notes</div><div class="field-val" style="color:#888">${o.notes}</div></div>`:''}
        ${receiptHtml}
      </div>
      <div class="card-footer">
      ${!isHistory&&o.status==='unpaid'?`<button class="btn btn-success" onclick="markPaid(${o.id})">Mark paid</button>`:''}
      ${!isHistory?`<button class="btn btn-warn" onclick="markComplete(${o.id})">Mark complete</button>`:''}
      ${!isHistory?`<button class="btn" onclick="editOrder(${o.id})">Edit</button>`:''}
      ${!isHistory?`<button class="btn btn-danger" onclick="deleteOrder(${o.id})">Delete</button>`:''}
      ${isHistory?`<button class="btn btn-danger" onclick="deleteHistory(${o.id})">Delete</button>`:''}
      ${isHistory?`<button class="btn btn-primary" onclick="triggerUpload(${o.id})">${o.receiptUrl ? 'Replace' : 'Upload'} Receipt</button>`:''}
      </div>
    </div>`;
}

function renderOrders(){
  const q=document.getElementById('search').value.toLowerCase();
  const f=document.getElementById('filter').value;
  let filtered=orders.filter(o=>{
    const items=o.items||[];
    const breadStr=items.map(i=>i.code).join(' ').toLowerCase();
    const match=o.name.toLowerCase().includes(q)||breadStr.includes(q);
    return match&&(f==='all'||o.status===f);
  });
  const list=document.getElementById('orders-list');
  if(!filtered.length){list.innerHTML='<div class="empty">No orders found</div>';updateStats();return;}
  list.innerHTML=filtered.map(o=>orderCardHTML(o,false)).join('');
  updateStats();
}

function renderHistory(){
  const q=document.getElementById('history-search').value.toLowerCase();
  let filtered=history.filter(o=>{
    const items=o.items||[];
    const breadStr=items.map(i=>i.code).join(' ').toLowerCase();
    return o.name.toLowerCase().includes(q)||breadStr.includes(q);
  });
  const list=document.getElementById('history-list');
  if(!filtered.length){list.innerHTML='<div class="empty">No history yet</div>';return;}
  const sorted=[...filtered].sort((a,b)=>b.date>a.date?1:-1);
  list.innerHTML=sorted.map(o=>orderCardHTML(o,true)).join('');
}

function renderDaily(){
  const date=document.getElementById('daily-date').value;
  if(!date){document.getElementById('daily-list').innerHTML='<div class="empty">Select a date</div>';return;}
  const dayOrders=[...orders,...history].filter(o=>o.date===date);

function triggerUpload(id) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const fileName = `receipt_${id}_${Date.now()}.jpg`;
      const { data: uploadData, error: uploadError } = await db.storage.from('receipts').upload(fileName, file);
      if (uploadError) throw uploadError;
      const { data: urlData } = db.storage.from('receipts').getPublicUrl(fileName);
      const publicUrl = urlData.publicUrl;
      await db.from('history').update({ receiptUrl: publicUrl }).eq('id', id);
      await loadFromSupabase();
      alert('Receipt uploaded successfully!');
    } catch (err) {
      console.error(err);
      alert('Upload failed: ' + err.message);
    }
  };
  input.click();
}

async function removeReceipt(id) {
  if (!confirm('Remove this receipt?')) return;
  try {
    const { data } = await db.from('history').select('receiptUrl').eq('id', id).single();
    if (data?.receiptUrl) {
      const fileName = data.receiptUrl.split('/').pop();
      await db.storage.from('receipts').remove([fileName]);
    }
    await db.from('history').update({ receiptUrl: null }).eq('id', id);
    await loadFromSupabase();
  } catch (err) {
    alert('Error removing receipt: ' + err.message);
  }
}

function calculate(){
  const rows=document.querySelectorAll('#calc-rows .calc-row');
  const totals={};
  let hasSelection=false;
  rows.forEach(row=>{
    const code=row.querySelector('.calc-bread-select').value;
    const qty=parseInt(row.querySelector('.calc-qty-input').value)||1;
    if(!code) return;
    hasSelection=true;
    const recipe=recipes.find(r=>r.code===code);
    if(!recipe||!recipe.ingredients){totals[`${code} (no recipe)`]=(totals[`${code} (no recipe)`]||0)+qty;return;}
    recipe.ingredients.split('\n').filter(l=>l.trim()).forEach(line=>{
      const parts=line.split(':');
      if(parts.length<2) return;
      const ingName=parts[0].trim();
      const rest=parts[1].trim();
      const match=rest.match(/^([\d.]+)\s*(.*)$/);
      if(match){
        const amount=parseFloat(match[1])*qty;
        const unit=match[2].trim();
        const key=`${ingName}|${unit}`;
        totals[key]=(totals[key]||0)+amount;
      } else {totals[ingName]=(totals[ingName]||0)+qty;}
    });
  });
  const result=document.getElementById('calc-result');
  if(!hasSelection){result.style.display='none';return;}
  if(!Object.keys(totals).length){result.style.display='block';result.innerHTML='No recipes found.';return;}
  result.style.display='block';
  result.innerHTML='<strong>Total ingredients needed:</strong><br>'+Object.entries(totals).map(([k,v])=>{const p=k.split('|');return `• ${p[0]}: <strong>${Number.isInteger(v)?v:v.toFixed(1)} ${p[1]||''}</strong>`;}).join('<br>');
}

function closeModal(){document.getElementById('modal-area').innerHTML='';editingOrder=null;editingTask=null;editingIng=null;editingRecipe=null;editingContact=null;}

function saveOrder(){
  const lines=document.querySelectorAll('.bread-line');
  const items=[];
  lines.forEach(line=>{
    const code=line.querySelector('.bl-code').value;
    const qty=parseInt(line.querySelector('.bl-qty').value)||1;
    items.push({code,qty});
  });
  const o={
    id:editingOrder||nextOrderId++,
    name:document.getElementById('f-name').value.trim(),
    phone:document.getElementById('f-phone').value.trim(),
    items:items,
    address:document.getElementById('f-addr').value.trim(),
    date:document.getElementById('f-date').value,
    time:document.getElementById('f-time').value,
    totalPrice:parseFloat(document.getElementById('f-total').value)||0,
    status:document.getElementById('f-status').value,
    payMethod:document.getElementById('f-paymethod').value,
    notes:document.getElementById('f-notes').value.trim(),
  };
  if(!o.name){alert('Please fill in customer name.');return;}
if(editingOrder){orders=orders.map(x=>x.id===editingOrder?o:x);}
  else{
    orders.push(o);
    const existing=contacts.find(c=>c.phone===o.phone||c.name===o.name);
    if(!existing){
      contacts.push({id:nextContactId++,name:o.name,phone:o.phone,waName:'',tngName:'',address:o.address});
    }
  }
  save();syncToSupabase('orders',orders);syncToSupabase('contacts',contacts);closeModal();renderOrders();renderContacts();
}

save();syncToSupabase('tasks',tasks);closeModal();renderSchedule();

function deleteOrder(id){if(confirm('Delete this order?')){orders=orders.filter(x=>x.id!==id);save();syncToSupabase('orders',orders);renderOrders();}}
function deleteTask(id){if(confirm('Delete this task?')){tasks=tasks.filter(x=>x.id!==id);save();syncToSupabase('tasks',tasks);renderSchedule();}}
function deleteIng(id){ingredients=ingredients.filter(x=>x.id!==id);save();syncToSupabase('ingredients',ingredients);renderIngredients();}
function deleteRecipe(id){if(confirm('Delete this recipe?')){recipes=recipes.filter(x=>x.id!==id);save();syncToSupabase('recipes',recipes);renderRecipes();}}
function deleteContact(id){if(confirm('Delete this contact?')){contacts=contacts.filter(x=>x.id!==id);save();syncToSupabase('contacts',contacts);renderContacts();}}
function deleteHistory(id){if(confirm('Delete from history?')){history=history.filter(x=>x.id!==id);save();syncToSupabase('history',history);renderHistory();}}
function markPaid(id){orders=orders.map(o=>o.id===id?{...o,status:'paid'}:o);save();syncToSupabase('orders',orders);renderOrders();}
function markComplete(id){if(confirm('Move this order to history?')){const o=orders.find(x=>x.id===id);if(o){history.push({...o,completedAt:new Date().toISOString()});orders=orders.filter(x=>x.id!==id);save();syncToSupabase('orders',orders);syncToSupabase('history',history);renderOrders();renderHistory();}}}
function toggleTask(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save();syncToSupabase('tasks',tasks);renderSchedule();}
function toggleIng(id){ingredients=ingredients.map(i=>i.id===id?{...i,checked:!i.checked}:i);save();syncToSupabase('ingredients',ingredients);renderIngredients();}
function clearChecked(){ingredients=ingredients.filter(i=>!i.checked);save();syncToSupabase('ingredients',ingredients);renderIngredients();}
function clearAll(){if(confirm('Clear all items?')){ingredients=[];save();syncToSupabase('ingredients',ingredients);renderIngredients();}}

document.getElementById('name-toggle').checked=showName;
populateCalcSelects();
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}
loadFromSupabase();
</script>
