<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Bread Tracker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#111;max-width:600px;margin:0 auto;padding-bottom:70px}
    .topbar{background:#111;color:white;padding:14px 16px;font-size:17px;font-weight:500;position:sticky;top:0;z-index:50}
    .tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:white;border-top:0.5px solid #e0e0e0;display:grid;grid-template-columns:1fr 1fr 1fr;z-index:50}
    .tab{padding:12px 8px;text-align:center;font-size:12px;color:#888;cursor:pointer;border:none;background:none}
    .tab.active{color:#111;font-weight:500;border-top:2px solid #111}
    .tab-icon{font-size:20px;display:block;margin-bottom:2px}
    .page{display:none;padding:1rem}
    .page.active{display:block}
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem}
    .stat{background:white;border-radius:10px;padding:12px;border:0.5px solid #e0e0e0}
    .stat-label{font-size:11px;color:#888;margin-bottom:4px}
    .stat-val{font-size:22px;font-weight:500}
    .toolbar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
    .toolbar input,.toolbar select{flex:1;min-width:120px;padding:8px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:14px;background:white}
    .btn{padding:8px 14px;border:0.5px solid #ddd;border-radius:8px;background:white;font-size:13px;cursor:pointer}
    .btn:active{transform:scale(0.98)}
    .btn-primary{background:#111;color:white;border-color:#111}
    .btn-danger{color:#c0392b}
    .btn-success{color:#27ae60}
    .btn-warn{color:#e67e22}
    .card{background:white;border:0.5px solid #e0e0e0;border-radius:12px;margin-bottom:10px;overflow:hidden}
    .card-header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:0.5px solid #f0f0f0}
    .avatar{width:38px;height:38px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#1a73e8;flex-shrink:0}
    .card-name{font-weight:500;font-size:15px}
    .card-sub{font-size:12px;color:#888}
    .badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500;margin-left:auto}
    .paid{background:#e8f5e9;color:#2e7d32}
    .unpaid{background:#fdecea;color:#c62828}
    .pending{background:#fff8e1;color:#f57f17}
    .done-badge{background:#e8f5e9;color:#2e7d32}
    .todo-badge{background:#e8f0fe;color:#1a73e8}
    .card-body{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
    .card-body.single{grid-template-columns:1fr}
    .field-label{color:#888;font-size:11px;margin-bottom:2px}
    .field-val{font-size:13px;font-weight:500}
    .card-footer{padding:8px 14px;border-top:0.5px solid #f0f0f0;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
    .overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:100}
    .modal{background:white;border-radius:14px 14px 0 0;padding:1.2rem;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
    .modal h3{font-size:16px;font-weight:500;margin-bottom:1rem}
    .form-row{margin-bottom:10px}
    .form-row label{display:block;font-size:12px;color:#888;margin-bottom:4px}
    .form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:14px}
    .form-row textarea{height:60px;resize:none}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
    .empty{text-align:center;padding:2rem;color:#888;font-size:14px}
    .ing-item{background:white;border:0.5px solid #e0e0e0;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
    .ing-item.checked{opacity:0.5}
    .ing-item.checked .ing-name{text-decoration:line-through}
    .ing-name{flex:1;font-size:14px;font-weight:500}
    .ing-qty{font-size:13px;color:#888;margin-right:8px}
    .checkbox{width:22px;height:22px;border-radius:6px;border:0.5px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:white}
    .checkbox.checked{background:#111;border-color:#111;color:white}
    .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .section-title{font-size:13px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:0.05em}
  </style>
</head>
<body>

<div class="topbar" id="topbar-title">Bread Tracker</div>

<div id="page-orders" class="page active">
  <div class="stats">
    <div class="stat"><div class="stat-label">Total orders</div><div class="stat-val" id="s-total">0</div></div>
    <div class="stat"><div class="stat-label">Unpaid</div><div class="stat-val" id="s-unpaid" style="color:#c62828">0</div></div>
    <div class="stat"><div class="stat-label">Today's orders</div><div class="stat-val" id="s-today">0</div></div>
    <div class="stat"><div class="stat-label">Revenue (RM)</div><div class="stat-val" id="s-rev">0</div></div>
  </div>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search..." oninput="renderOrders()">
    <select id="filter" onchange="renderOrders()">
      <option value="all">All</option>
      <option value="unpaid">Unpaid</option>
      <option value="paid">Paid</option>
      <option value="pending">Pending</option>
    </select>
    <button class="btn btn-primary" onclick="showOrderModal()">+ New order</button>
  </div>
  <div id="orders-list"></div>
</div>

<div id="page-schedule" class="page">
  <div class="section-header">
    <span class="section-title">Schedule</span>
    <button class="btn btn-primary" onclick="showTaskModal()">+ Add task</button>
  </div>
  <div id="schedule-list"></div>
</div>

<div id="page-ingredients" class="page">
  <div class="section-header">
    <span class="section-title">Ingredients</span>
    <button class="btn btn-primary" onclick="showIngModal()">+ Add item</button>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:1rem">
    <button class="btn" onclick="clearChecked()" style="font-size:12px">Clear checked</button>
    <button class="btn btn-danger" onclick="clearAll()" style="font-size:12px">Clear all</button>
  </div>
  <div id="ingredients-list"></div>
</div>

<div id="modal-area"></div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('orders')" id="tab-orders">
    <span class="tab-icon">🧾</span>Orders
  </button>
  <button class="tab" onclick="switchTab('schedule')" id="tab-schedule">
    <span class="tab-icon">🕐</span>Schedule
  </button>
  <button class="tab" onclick="switchTab('ingredients')" id="tab-ingredients">
    <span class="tab-icon">🧂</span>Ingredients
  </button>
</div>

<script>
let orders = JSON.parse(localStorage.getItem('bread-orders')||'[]');
let tasks = JSON.parse(localStorage.getItem('bread-tasks')||'[]');
let ingredients = JSON.parse(localStorage.getItem('bread-ingredients')||'[]');
let nextOrderId = parseInt(localStorage.getItem('bread-oid')||'1');
let nextTaskId = parseInt(localStorage.getItem('bread-tid')||'1');
let nextIngId = parseInt(localStorage.getItem('bread-iid')||'1');
let editingOrder = null;
let editingTask = null;
let editingIng = null;

const titles = {orders:'Bread Tracker',schedule:'Schedule',ingredients:'Ingredients'};

function save(){
  localStorage.setItem('bread-orders',JSON.stringify(orders));
  localStorage.setItem('bread-tasks',JSON.stringify(tasks));
  localStorage.setItem('bread-ingredients',JSON.stringify(ingredients));
  localStorage.setItem('bread-oid',nextOrderId);
  localStorage.setItem('bread-tid',nextTaskId);
  localStorage.setItem('bread-iid',nextIngId);
}

function switchTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('topbar-title').textContent=titles[tab];
}

function today(){return new Date().toISOString().split('T')[0]}
function initials(name){return name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()}

function updateStats(){
  document.getElementById('s-total').textContent=orders.length;
  document.getElementById('s-unpaid').textContent=orders.filter(o=>o.status==='unpaid').length;
  document.getElementById('s-today').textContent=orders.filter(o=>o.date===today()).length;
  const rev=orders.filter(o=>o.status==='paid').reduce((a,o)=>a+o.price,0);
  document.getElementById('s-rev').textContent='RM '+rev.toFixed(2);
}

function renderOrders(){
  const q=document.getElementById('search').value.toLowerCase();
  const f=document.getElementById('filter').value;
  let filtered=orders.filter(o=>{
    const match=o.name.toLowerCase().includes(q)||o.bread.toLowerCase().includes(q);
    return match&&(f==='all'||o.status===f);
  });
  const list=document.getElementById('orders-list');
  if(!filtered.length){list.innerHTML='<div class="empty">No orders found</div>';updateStats();return;}
  list.innerHTML=filtered.map(o=>`
    <div class="card">
      <div class="card-header">
        <div class="avatar">${initials(o.name)}</div>
        <div><div class="card-name">${o.name}</div><div class="card-sub">${o.phone}</div></div>
        <span class="badge ${o.status}">${o.status}</span>
      </div>
      <div class="card-body">
        <div><div class="field-label">Bread order</div><div class="field-val">${o.bread}</div></div>
        <div><div class="field-label">Price</div><div class="field-val">RM ${o.price.toFixed(2)}</div></div>
        <div><div class="field-label">Date</div><div class="field-val">${o.date}</div></div>
        <div><div class="field-label">Time</div><div class="field-val">${o.time}</div></div>
        <div style="grid-column:1/-1"><div class="field-label">Address</div><div class="field-val">${o.address}</div></div>
        ${o.notes?`<div style="grid-column:1/-1"><div class="field-label">Notes</div><div class="field-val" style="color:#888">${o.notes}</div></div>`:''}
      </div>
      <div class="card-footer">
        ${o.status==='unpaid'?`<button class="btn btn-success" onclick="markPaid(${o.id})">Mark paid</button>`:''}
        <button class="btn" onclick="editOrder(${o.id})">Edit</button>
        <button class="btn btn-danger" onclick="deleteOrder(${o.id})">Delete</button>
      </div>
    </div>`).join('');
  updateStats();
}

function renderSchedule(){
  const list=document.getElementById('schedule-list');
  if(!tasks.length){list.innerHTML='<div class="empty">No tasks yet. Add your first task.</div>';return;}
  const sorted=[...tasks].sort((a,b)=>a.date+a.time>b.date+b.time?1:-1);
  list.innerHTML=sorted.map(t=>`
    <div class="card">
      <div class="card-header">
        <div class="avatar" style="background:${t.done?'#e8f5e9':'#e8f0fe'};color:${t.done?'#2e7d32':'#1a73e8'}">${t.done?'✓':'⏰'}</div>
        <div><div class="card-name">${t.title}</div><div class="card-sub">${t.date} at ${t.time}</div></div>
        <span class="badge ${t.done?'done-badge':'todo-badge'}">${t.done?'done':'to do'}</span>
      </div>
      ${t.notes?`<div class="card-body single"><div class="field-label">Notes</div><div class="field-val">${t.notes}</div></div>`:''}
      <div class="card-footer">
        <button class="btn ${t.done?'btn-warn':'btn-success'}" onclick="toggleTask(${t.id})">${t.done?'Mark undone':'Mark done'}</button>
        <button class="btn" onclick="editTask(${t.id})">Edit</button>
        <button class="btn btn-danger" onclick="deleteTask(${t.id})">Delete</button>
      </div>
    </div>`).join('');
}

function renderIngredients(){
  const list=document.getElementById('ingredients-list');
  if(!ingredients.length){list.innerHTML='<div class="empty">No ingredients yet. Add items to your list.</div>';return;}
  const unchecked=ingredients.filter(i=>!i.checked);
  const checked=ingredients.filter(i=>i.checked);
  const all=[...unchecked,...checked];
  list.innerHTML=all.map(i=>`
    <div class="ing-item ${i.checked?'checked':''}">
      <div class="checkbox ${i.checked?'checked':''}" onclick="toggleIng(${i.id})">${i.checked?'✓':''}</div>
      <span class="ing-name">${i.name}</span>
      <span class="ing-qty">${i.qty}</span>
      <button class="btn" style="padding:4px 10px;font-size:12px" onclick="editIng(${i.id})">Edit</button>
      <button class="btn btn-danger" style="padding:4px 10px;font-size:12px" onclick="deleteIng(${i.id})">✕</button>
    </div>`).join('');
}

function showOrderModal(data){
  const d=data||{name:'',phone:'',bread:'',address:'',date:today(),time:'08:00',price:'',status:'unpaid',notes:''};
  document.getElementById('modal-area').innerHTML=`
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${editingOrder?'Edit order':'New order'}</h3>
        <div class="form-row"><label>Customer name</label><input id="f-name" value="${d.name}" placeholder="Full name"></div>
        <div class="form-row"><label>Phone number</label><input id="f-phone" value="${d.phone}" placeholder="012-3456789"></div>
        <div class="form-row"><label>Bread order</label><input id="f-bread" value="${d.bread}" placeholder="e.g. Sourdough x2"></div>
        <div class="form-row"><label>Delivery address</label><textarea id="f-addr">${d.address}</textarea></div>
        <div class="form-grid">
          <div class="form-row"><label>Date</label><input type="date" id="f-date" value="${d.date}"></div>
          <div class="form-row"><label>Time</label><input type="time" id="f-time" value="${d.time}"></div>
        </div>
        <div class="form-grid">
          <div class="form-row"><label>Price (RM)</label><input type="number" id="f-price" value="${d.price}" placeholder="0.00"></div>
          <div class="form-row"><label>Payment</label>
            <select id="f-status">
              <option value="unpaid" ${d.status==='unpaid'?'selected':''}>Unpaid</option>
              <option value="paid" ${d.status==='paid'?'selected':''}>Paid</option>
              <option value="pending" ${d.status==='pending'?'selected':''}>Pending</option>
            </select>
          </div>
        </div>
        <div class="form-row"><label>Notes (optional)</label><textarea id="f-notes">${d.notes}</textarea></div>
        <div class="form-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveOrder()">${editingOrder?'Save':'Add order'}</button>
        </div>
      </div>
    </div>`;
}

function showTaskModal(data){
  const d=data||{title:'',date:today(),time:'06:00',notes:''};
  document.getElementById('modal-area').innerHTML=`
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${editingTask?'Edit task':'New task'}</h3>
        <div class="form-row"><label>Task name</label><input id="t-title" value="${d.title}" placeholder="e.g. Preheat oven"></div>
        <div class="form-grid">
          <div class="form-row"><label>Date</label><input type="date" id="t-date" value="${d.date}"></div>
          <div class="form-row"><label>Time</label><input type="time" id="t-time" value="${d.time}"></div>
        </div>
        <div class="form-row"><label>Notes (optional)</label><textarea id="t-notes">${d.notes}</textarea></div>
        <div class="form-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveTask()">${editingTask?'Save':'Add task'}</button>
        </div>
      </div>
    </div>`;
}

function showIngModal(data){
  const d=data||{name:'',qty:''};
  document.getElementById('modal-area').innerHTML=`
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${editingIng?'Edit ingredient':'New ingredient'}</h3>
        <div class="form-row"><label>Ingredient name</label><input id="i-name" value="${d.name}" placeholder="e.g. Bread flour"></div>
        <div class="form-row"><label>Quantity</label><input id="i-qty" value="${d.qty}" placeholder="e.g. 2kg, 500g, 3 eggs"></div>
        <div class="form-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveIng()">${editingIng?'Save':'Add item'}</button>
        </div>
      </div>
    </div>`;
}

function closeModal(){document.getElementById('modal-area').innerHTML='';editingOrder=null;editingTask=null;editingIng=null;}

function saveOrder(){
  const o={
    id:editingOrder||nextOrderId++,
    name:document.getElementById('f-name').value.trim(),
    phone:document.getElementById('f-phone').value.trim(),
    bread:document.getElementById('f-bread').value.trim(),
    address:document.getElementById('f-addr').value.trim(),
    date:document.getElementById('f-date').value,
    time:document.getElementById('f-time').value,
    price:parseFloat(document.getElementById('f-price').value)||0,
    status:document.getElementById('f-status').value,
    notes:document.getElementById('f-notes').value.trim(),
  };
  if(!o.name||!o.bread){alert('Please fill in customer name and bread order.');return;}
  if(editingOrder){orders=orders.map(x=>x.id===editingOrder?o:x);}
  else{orders.push(o);}
  save();closeModal();renderOrders();
}

function saveTask(){
  const t={
    id:editingTask||nextTaskId++,
    title:document.getElementById('t-title').value.trim(),
    date:document.getElementById('t-date').value,
    time:document.getElementById('t-time').value,
    notes:document.getElementById('t-notes').value.trim(),
    done:false,
  };
  if(editingTask){
    const old=tasks.find(x=>x.id===editingTask);
    t.done=old?old.done:false;
    tasks=tasks.map(x=>x.id===editingTask?t:x);
  } else{tasks.push(t);}
  save();closeModal();renderSchedule();
}

function saveIng(){
  const i={
    id:editingIng||nextIngId++,
    name:document.getElementById('i-name').value.trim(),
    qty:document.getElementById('i-qty').value.trim(),
    checked:false,
  };
  if(!i.name){alert('Please enter ingredient name.');return;}
  if(editingIng){
    const old=ingredients.find(x=>x.id===editingIng);
    i.checked=old?old.checked:false;
    ingredients=ingredients.map(x=>x.id===editingIng?i:x);
  } else{ingredients.push(i);}
  save();closeModal();renderIngredients();
}

function editOrder(id){editingOrder=id;showOrderModal(orders.find(x=>x.id===id));}
function editTask(id){editingTask=id;showTaskModal(tasks.find(x=>x.id===id));}
function editIng(id){editingIng=id;showIngModal(ingredients.find(x=>x.id===id));}

function deleteOrder(id){if(confirm('Delete this order?')){orders=orders.filter(x=>x.id!==id);save();renderOrders();}}
function deleteTask(id){if(confirm('Delete this task?')){tasks=tasks.filter(x=>x.id!==id);save();renderSchedule();}}
function deleteIng(id){ingredients=ingredients.filter(x=>x.id!==id);save();renderIngredients();}

function markPaid(id){orders=orders.map(o=>o.id===id?{...o,status:'paid'}:o);save();renderOrders();}
function toggleTask(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save();renderSchedule();}
function toggleIng(id){ingredients=ingredients.map(i=>i.id===id?{...i,checked:!i.checked}:i);save();renderIngredients();}

function clearChecked(){ingredients=ingredients.filter(i=>!i.checked);save();renderIngredients();}
function clearAll(){if(confirm('Clear all ingredients?')){ingredients=[];save();renderIngredients();}}

if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}

renderOrders();renderSchedule();renderIngredients();
</script>
</body>
</html>
